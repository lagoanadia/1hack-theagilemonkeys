<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de convocatorias · Reforesta</title>
<style>
  :root {
    --bg: #f6f7f4; --card: #ffffff; --text: #1d2a1f; --muted: #5d6b60;
    --line: #dfe5dc; --green: #2f7d32; --green-soft: #e3f1e2;
    --amber: #a86400; --amber-soft: #fbefd9; --red: #b3261e; --red-soft: #f9e1df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121612; --card: #1b211b; --text: #e6ece5; --muted: #9aa79b;
      --line: #2c352c; --green: #7cc47f; --green-soft: #213321;
      --amber: #e2a94c; --amber-soft: #352a17; --red: #f08b84; --red-soft: #3a1f1d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 24px 16px 8px; max-width: 1000px; margin: auto; }
  h1 { margin: 0; font-size: 1.5rem; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: .9rem; }
  main { max-width: 1000px; margin: auto; padding: 0 16px 48px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 10px 14px; min-width: 120px; }
  .stat b { display: block; font-size: 1.4rem; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .controls input[type=search], .controls select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--text); font: inherit; }
  .controls input[type=search] { flex: 1; min-width: 200px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 10px; display: grid;
          grid-template-columns: 56px 1fr; gap: 14px; }
  .card.descartada { opacity: .45; }
  .score { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center;
           font-weight: 700; font-size: 1.2rem; }
  .s-alta { background: var(--green-soft); color: var(--green); }
  .s-media { background: var(--amber-soft); color: var(--amber); }
  .s-baja { background: var(--red-soft); color: var(--red); }
  .titulo { font-weight: 600; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: .85rem; display: flex; gap: 12px; flex-wrap: wrap; }
  .resumen { margin: 8px 0 0; }
  .motivo { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .req { margin: 4px 0 0; font-size: .9rem; }
  .plazo-urgente { color: var(--red); font-weight: 600; }
  .acciones { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .acciones a, .acciones button {
    font: inherit; font-size: .85rem; padding: 5px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    text-decoration: none; cursor: pointer; }
  .acciones button.on { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .vacio { text-align: center; color: var(--muted); padding: 40px 0; }
  @media (max-width: 560px) { .card { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🌱 Radar de convocatorias</h1>
  <p class="sub" id="sub">Cargando…</p>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Buscar por título, órgano o motivo…">
    <select id="min">
      <option value="70">Recomendadas (≥70)</option>
      <option value="50">Posibles (≥50)</option>
      <option value="0">Todas</option>
    </select>
    <select id="orden">
      <option value="puntuacion">Ordenar por encaje</option>
      <option value="plazo">Ordenar por plazo</option>
      <option value="publicada">Más recientes</option>
    </select>
    <label><input type="checkbox" id="verDescartadas"> ver descartadas</label>
  </div>
  <div id="lista"></div>
</main>

<script>
// El estado "me interesa / descartada" se guarda solo en este navegador (localStorage).
const CLAVE = "radar-reforesta-estado";
let estado = {};
try { estado = JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch (e) {}
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(estado)); } catch (e) {} };

let datos = { convocatorias: [] };
const $ = id => document.getElementById(id);
const euros = n => n ? n.toLocaleString("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }) : "—";
const diasHasta = f => f ? Math.ceil((new Date(f) - new Date(new Date().toDateString())) / 864e5) : null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function plazoHTML(c) {
  const d = diasHasta(c.fin);
  if (d === null) return esc(c.plazo_texto || "plazo sin fecha fija");
  const txt = `cierra ${new Date(c.fin).toLocaleDateString("es-ES")} (${d} días)`;
  return d <= 15 ? `<span class="plazo-urgente">⏰ ${txt}</span>` : txt;
}

function pintar() {
  const q = $("q").value.toLowerCase();
  const min = +$("min").value;
  const verDesc = $("verDescartadas").checked;
  let lista = datos.convocatorias.filter(c =>
    c.puntuacion >= min &&
    (verDesc || estado[c.codigo] !== "descartada") &&
    (!q || `${c.titulo} ${c.organo} ${c.motivo} ${c.resumen}`.toLowerCase().includes(q)));

  const orden = $("orden").value;
  if (orden === "plazo") lista.sort((a, b) => (a.fin || "9999").localeCompare(b.fin || "9999"));
  else if (orden === "publicada") lista.sort((a, b) => (b.publicada || "").localeCompare(a.publicada || ""));
  else lista.sort((a, b) => b.puntuacion - a.puntuacion);

  $("lista").innerHTML = lista.length ? lista.map(c => {
    const nivel = c.puntuacion >= 70 ? "alta" : c.puntuacion >= 50 ? "media" : "baja";
    const st = estado[c.codigo];
    return `<article class="card ${st === "descartada" ? "descartada" : ""}">
      <div class="score s-${nivel}" title="Encaje con Reforesta">${c.puntuacion}</div>
      <div>
        <p class="titulo">${esc(c.titulo)}</p>
        <div class="meta">
          <span>🏛️ ${esc(c.organo)}</span>
          <span>💶 ${euros(c.presupuesto)}</span>
          <span>📅 ${plazoHTML(c)}</span>
          ${c.linea ? `<span>🌿 ${esc(c.linea)}</span>` : ""}
        </div>
        ${c.resumen && c.resumen !== c.titulo ? `<p class="resumen">${esc(c.resumen)}</p>` : ""}
        <p class="motivo">${esc(c.motivo)}</p>
        ${c.requisitos_clave ? `<p class="req">⚠️ ${esc(c.requisitos_clave)}</p>` : ""}
        <div class="acciones">
          <a href="${esc(c.url)}" target="_blank" rel="noopener">Ver en BDNS ↗</a>
          ${c.url_bases ? `<a href="${esc(c.url_bases)}" target="_blank" rel="noopener">Bases ↗</a>` : ""}
          ${c.sede ? `<a href="${esc(c.sede)}" target="_blank" rel="noopener">Sede electrónica ↗</a>` : ""}
          <button data-c="${c.codigo}" data-e="interesa" class="${st === "interesa" ? "on" : ""}">⭐ Me interesa</button>
          <button data-c="${c.codigo}" data-e="descartada" class="${st === "descartada" ? "on" : ""}">✕ Descartar</button>
        </div>
      </div>
    </article>`;
  }).join("") : `<p class="vacio">No hay convocatorias con estos filtros.</p>`;
}

$("lista").addEventListener("click", e => {
  const b = e.target.closest("button[data-c]");
  if (!b) return;
  const { c, e: valor } = b.dataset;
  estado[c] = estado[c] === valor ? undefined : valor;
  guardar(); pintar();
});
["q", "min", "orden", "verDescartadas"].forEach(id => $(id).addEventListener("input", pintar));

fetch("data/convocatorias.json", { cache: "no-store" })
  .then(r => r.json())
  .then(d => {
    datos = d;
    const recomendadas = d.convocatorias.filter(c => c.puntuacion >= 70).length;
    const urgentes = d.convocatorias.filter(c => { const x = diasHasta(c.fin); return c.puntuacion >= 50 && x !== null && x <= 15; }).length;
    $("sub").textContent = `Actualizado ${new Date(d.generado).toLocaleString("es-ES")} · fuente: BDNS · evaluación: ${d.modo}`;
    $("stats").innerHTML = [
      [d.revisadas, `revisadas (últimos ${d.ventana_dias} días)`],
      [d.descartadas, "descartadas automáticamente"],
      [recomendadas, "recomendadas"],
      [urgentes, "cierran en ≤15 días"],
    ].map(([n, t]) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`).join("");
    pintar();
  })
  .catch(() => { $("sub").textContent = "No se pudo cargar data/convocatorias.json"; });
</script>
</body>
</html>
