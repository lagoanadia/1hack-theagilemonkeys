# Ejecuta el radar cada mañana y guarda el resultado en el repo.
# Cada push redespliega la web en Cloudflare.
name: Radar diario

on:
  schedule:
    - cron: "17 5 * * *"   # todos los días a las 05:17 UTC
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write           # necesario para hacer commit del JSON

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # la primera ejecución con Groq tarda ~20 min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ejecutar radar
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"   # ver el progreso en directo en el log
        run: python -m radar
      - name: Guardar resultados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add web/public/data/convocatorias.json data/vistas.json
          git diff --staged --quiet || git commit -m "Radar: actualización diaria"
          git push
